# 无 Mac 编译打包：GitHub Actions 云端 macOS 构建 → 产出未签名 ipa
#
# 用法：
#   1. 把整个工作区推到 GitHub（含 .github/workflows/ios-build.yml）
#   2. Actions 页面手动触发 "iOS Build (unsigned ipa)"（或 push 到 main/master 自动触发）
#   3. 完成后在 run 的 Artifacts 下载 CialloReader-unsigned-ipa
#   4. Windows 上用 Sideloadly（需装 iTunes 官方版 + iCloud 驱动）选 ipa + Apple ID 自签安装
#      免费账号 7 天有效期，到期重新签一次即可
#
# 有付费开发者账号（$99/年）想出正式签名 ipa：
#   在仓库 Secrets 加 APPLE_CERTIFICATE_P12 / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD，
#   并把下面 "sign" job 里注释的三步解开（fastlane match 或手动 security import 均可）。

name: iOS Build (unsigned ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # 16.2 的 actool 与 runner 模拟器运行时注册表不匹配；26.x 工具链对 SwiftSoup/ZIPFoundation 偏新。
          # 优先 16.4，其次 16.3 / 16.1。
          for v in 16.4.0 16.4 16.3.0 16.3 16.1.0 16.1; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              echo "selecting /Applications/Xcode_$v.app"
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version

      - name: Sync Venera JS assets
        run: bash ios/tools/sync_js_assets.sh

      - name: Resolve SPM packages
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies -project CialloReader.xcodeproj -scheme CialloReader

      - name: Build (device arm64, unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild archive \
            -project CialloReader.xcodeproj \
            -scheme CialloReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CialloReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: Package unsigned ipa
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R CialloReader.xcarchive/Products/Applications/CialloReader.app Payload/
          zip -qry CialloReader-unsigned.ipa Payload
          ls -la CialloReader-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CialloReader-unsigned-ipa
          path: ios/build/CialloReader-unsigned.ipa
          if-no-files-found: error

      # ── 可选：付费账号出正式签名 ipa（解开下面注释并配 Secrets）──
