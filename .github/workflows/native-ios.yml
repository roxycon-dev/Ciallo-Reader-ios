name: Native iOS verification
on:
  pull_request:
    paths: ['IOS/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: IOS
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: IOS/.nvmrc
          cache: npm
          cache-dependency-path: IOS/package-lock.json
      - run: npm ci
      - run: npm run ios:sync
      - name: Compile registered Swift plugins and the complete app
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath native-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee native-build.log
      - name: Sign simulator bundle with isolated Keychain entitlements
        run: bash scripts/sign-ios-simulator.sh native-build/Build/Products/Debug-iphonesimulator/App.app
      - name: Launch the native app in the simulator
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          capture_diagnostics() {
            python3 scripts/run-bounded.py 30 xcrun simctl io "$device_id" screenshot native-startup.png 2>/dev/null || true
            python3 scripts/run-bounded.py 45 xcrun simctl spawn "$device_id" log show --last 10m --style compact --predicate 'process == "App" OR (process == "SpringBoard" AND eventMessage CONTAINS "com.aistudio.ciallo.reader") OR process == "amfid"' > native-runtime.log 2>&1 || true
          }
          trap capture_diagnostics EXIT
          python3 scripts/run-bounded.py 30 xcrun simctl boot "$device_id" || true
          python3 scripts/run-bounded.py 480 xcrun simctl bootstatus "$device_id" -b
          python3 scripts/run-bounded.py 120 xcrun simctl install "$device_id" native-build/Build/Products/Debug-iphonesimulator/App.app
          launched=0
          for attempt in $(seq 1 8); do
            if SIMCTL_CHILD_CIALLO_NATIVE_TESTS=1 python3 scripts/run-bounded.py 20 xcrun simctl launch "$device_id" com.aistudio.ciallo.reader > native-launch.log 2>&1; then launched=1; break; fi
            sleep 10
          done
          cat native-launch.log
          test "$launched" = 1 || exit 1
          container=$(python3 scripts/run-bounded.py 20 xcrun simctl get_app_container "$device_id" com.aistudio.ciallo.reader data)
          state="$container/Library/Caches/reader-startup.json"
          python3 scripts/run-bounded.py 250 python3 scripts/wait-ios-startup.py "$state" native-startup-state.json
          sleep 2
          cp "$container/Library/Caches/reader-capabilities.json" native-capabilities.json
          python3 -c 'import json,sys; checks=json.load(open(sys.argv[1]))["checks"]; print(json.dumps(checks,ensure_ascii=False,indent=2)); assert len(checks)==13 and all(c["passed"] for c in checks)' native-capabilities.json
          cp "$container/Library/Caches/reader-transfer-stored.zip" native-transfer-stored.zip
          java scripts/VerifyTransferZip.java native-transfer-stored.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-diagnostics
          path: |
            IOS/native-build.log
            IOS/native-runtime.log
            IOS/native-startup.png
            IOS/native-startup-state.json
            IOS/native-launch.log
            IOS/native-capabilities.json
              IOS/native-transfer-stored.zip
          retention-days: 7
